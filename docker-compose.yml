# Почта: пароль приложения (SMTP/IMAP, в т.ч. SMTP-relay) или Gmail API (OAuth). Значения берутся из .env;
# MAIL_POLL_SECONDS принимает и старое имя IMAP_POLL_SECONDS.
x-gmail-env: &gmail-env
  GMAIL_USER: ${GMAIL_USER:-}
  GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
  SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  IMAP_HOST: ${IMAP_HOST:-imap.gmail.com}
  IMAP_PORT: ${IMAP_PORT:-993}
  GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
  GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
  GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
  MAIL_POLL_SECONDS: ${MAIL_POLL_SECONDS:-${IMAP_POLL_SECONDS:-90}}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Mini App. При старте применяет миграции Alembic.
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *gmail-env           # web отправляет письма
      INGEST_TOKEN: ${INGEST_TOKEN:-}   # POST /api/ingest/ticket; пусто — API выключен
    command: sh -c "alembic upgrade head && uvicorn app.web.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    command: python -m app.bot.main
    depends_on:
      web:
        condition: service_healthy   # ждём, пока web применит миграции

  mail-worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: *gmail-env   # приём писем: IMAP или Gmail API
    command: python -m app.mail_worker.main
    depends_on:
      web:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      WEBAPP_DOMAIN: ${WEBAPP_DOMAIN:?WEBAPP_DOMAIN не задан в .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
